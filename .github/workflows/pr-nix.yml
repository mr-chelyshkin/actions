name: Nix CI on Pr

on:
  workflow_call:
    inputs:
      environment:
        description: Task environment as comma-separated KEY=value pairs, passed to invoke-taskfile.
        type: string
        default: ''

jobs:
  fmt:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check Nix formatting
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/nixos-fmt
          environment: ${{ inputs.environment }}

  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Lint Nix
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/nixos-lint
          environment: ${{ inputs.environment }}
