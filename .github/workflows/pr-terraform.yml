name: Terraform CI

on:
  workflow_call:
    inputs:
      environment:
        description: Environment variables for Terraform plan as a JSON object.
        type: string
        required: false
        default: '{}'
      aws-region:
        description: AWS region used when assuming the Terraform role.
        type: string
        required: false
        default: ''
      terraform-role-arn:
        description: AWS role to assume through GitHub OIDC before Terraform plan.
        type: string
        required: false
        default: ''

jobs:
  fmt:
    name: Terraform format
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check Terraform formatting
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with: { command: ci/terraform-fmt }

  validate:
    name: Terraform validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Validate Terraform
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with: { command: ci/terraform-validate }

  plan:
    name: Terraform plan
    needs: [fmt, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        if: inputs.terraform-role-arn != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.terraform-role-arn }}
          role-session-name: terraform-plan-${{ github.run_id }}

      - name: Prepare Terraform task
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: --dry ci/terraform-plan

      - name: Run Terraform plan
        shell: bash
        run: |
          set -euo pipefail

          task --yes --offline ci/terraform-plan | tee "$RUNNER_TEMP/terraform-plan.log"

          {
            printf '## Terraform plan\n\n~~~text\n'
            sed -E $'s/\033\\[[0-?]*[ -/]*[@-~]//g' "$RUNNER_TEMP/terraform-plan.log"
            printf '\n~~~\n'
          } >> "$GITHUB_STEP_SUMMARY"
