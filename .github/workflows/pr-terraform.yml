name: Terraform CI on Pr

on:
  workflow_call:
    inputs:
      environment:
        description: Environment variables of every job as a JSON object.
        type: string
        default: '{}'
      aws-region:
        description: AWS region used when assuming the Terraform role.
        type: string
        required: false
        default: ''
      terraform-role-arn:
        description: AWS role to assume through GitHub OIDC before Terraform plan.
        type: string
        required: false
        default: ''
      cache-path:
        description: Host provider cache paths to preserve. Empty disables provider caching.
        type: string
        default: ''
      cache-key-prefix:
        description: Cache namespace. Change it to invalidate previous caches.
        type: string
        default: terraform
      cache-dependency-path:
        description: Lock file path or glob to hash after checkout for provider changes.
        type: string
        default: '**/.terraform.lock.hcl'

jobs:
  fmt:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check Terraform formatting
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with: { command: ci/terraform/fmt }

  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - &terraform-cache
        name: Cache Terraform providers
        if: inputs.cache-path != ''
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.cache-dependency-path) }}
          restore-keys: |
            ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate Terraform
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with: { command: ci/terraform/validate }

  plan:
    needs: [fmt, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - *terraform-cache

      - name: Configure AWS credentials
        if: inputs.terraform-role-arn != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.terraform-role-arn }}
          role-session-name: terraform-plan-${{ github.run_id }}

      - name: Prepare Terraform task
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: --dry ci/terraform/plan

      - name: Run Terraform plan
        shell: bash
        run: |
          set -euo pipefail

          task --yes --offline ci/terraform/plan | tee "$RUNNER_TEMP/terraform-plan.log"

          {
            printf '## Terraform plan\n\n~~~text\n'
            sed -E $'s/\033\\[[0-?]*[ -/]*[@-~]//g' "$RUNNER_TEMP/terraform-plan.log"
            printf '\n~~~\n'
          } >> "$GITHUB_STEP_SUMMARY"
