name: Python CI on Pr

on:
  workflow_call:
    inputs:
      environment:
        description: Task environment as comma-separated KEY=value pairs, passed to invoke-taskfile.
        type: string
        default: ''

jobs:
  fmt:
    name: Python format
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check Python formatting
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/python-fmt
          environment: ${{ inputs.environment }}

  lint:
    name: Python lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Lint Python
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/python-lint
          environment: ${{ inputs.environment }}

  typecheck:
    name: Python typecheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check Python types
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/python-typecheck
          environment: ${{ inputs.environment }}
