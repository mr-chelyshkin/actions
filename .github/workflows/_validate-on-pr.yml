name: PR workflow validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: pr-workflow-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  label-check:
    name: Label check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Label check
        uses: ./check-changelog-label

  actionlint:
    name: Actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12

  gate:
    if: always()
    needs: [label-check, actionlint]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check job results
        uses: ./check-job-results
        with:
          results: ${{ toJSON(needs) }}
