name: AWS S3 static site CD

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Artifact of this run with the built site, index.html at its root.
        type: string
        required: true
      immutable-assets:
        description: Publish fingerprinted assets/ with immutable cache headers.
        type: boolean
        default: true
      aws-region:
        description: AWS region of the site bucket.
        type: string
        required: true
      aws-role-arn:
        description: AWS role to assume via OIDC for apply and deploy.
        type: string
        required: true
      terraform-state-bucket:
        description: S3 bucket for Terraform state.
        type: string
        required: true
      terraform-state-key:
        description: S3 object key for Terraform state.
        type: string
        required: true
      terraform-state-region:
        description: AWS region of the state bucket.
        type: string
        required: true
      terraform-version:
        description: Terraform version. Empty reads .terraform-version in working-directory.
        type: string
        required: false
        default: ''
      working-directory:
        description: Terraform directory relative to the workspace.
        type: string
        required: false
        default: .
      domain-name:
        description: Site domain for the CloudFront alias. DNS is managed outside this stack.
        type: string
        required: true
      site-bucket-name:
        description: Globally unique S3 bucket name for the site.
        type: string
        required: true
      acm-certificate-arn:
        description: ACM certificate ARN in us-east-1 for CloudFront.
        type: string
        required: true
    secrets:
      terraform-vars:
        description: Terraform variables as NAME=value lines, passed as TF_VAR_NAME.
        required: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      IMMUTABLE_ASSETS: ${{ inputs.immutable-assets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/static
      - name: Validate site artifact
        shell: bash
        env:
          SOURCE_DIR: ${{ runner.temp }}/static
        run: |
          set -euo pipefail

          if [[ ! -f "$SOURCE_DIR/index.html" || -L "$SOURCE_DIR/index.html" ]]; then
            echo "::error::Static artifact must contain a regular index.html at its root."
            exit 1
          fi

          if [[ "$IMMUTABLE_ASSETS" == true && ! -d "$SOURCE_DIR/assets" ]]; then
            echo "::error::immutable-assets requires an assets/ directory containing fingerprinted files."
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.aws-role-arn }}
          role-session-name: static-release-${{ github.run_id }}
      - name: Export Terraform variables
        shell: bash
        env:
          TERRAFORM_VARS: ${{ secrets.terraform-vars }}
        run: |
          set -euo pipefail

          while IFS= read -r line; do
            line=${line%$'\r'}
            [[ -z "${line//[[:space:]]/}" ]] && continue
            name=${line%%=*}
            value=${line#*=}
            if [[ "$line" != *=* || ! "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::Each terraform-vars line must be NAME=value."
              exit 1
            fi
            [[ -n "$value" ]] && echo "::add-mask::$value"
            printf 'TF_VAR_%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done <<< "$TERRAFORM_VARS"
      - name: Apply Terraform
        id: apply
        uses: mr-chelyshkin/actions/terraform-apply@v2
        env:
          TF_VAR_aws_region: ${{ inputs.aws-region }}
          TF_VAR_domain_name: ${{ inputs.domain-name }}
          TF_VAR_site_bucket_name: ${{ inputs.site-bucket-name }}
          TF_VAR_acm_certificate_arn: ${{ inputs.acm-certificate-arn }}
        with:
          terraform-state-region: ${{ inputs.terraform-state-region }}
          terraform-state-bucket: ${{ inputs.terraform-state-bucket }}
          terraform-state-key: ${{ inputs.terraform-state-key }}
          working-directory: ${{ inputs.working-directory }}
          terraform-version: ${{ inputs.terraform-version }}
      - name: Read Terraform outputs
        id: site
        shell: bash
        env:
          TF_OUTPUTS: ${{ steps.apply.outputs.terraform-outputs }}
        run: |
          set -euo pipefail

          bucket=$(jq -er '.site_bucket_name.value | strings | select(length > 0)' <<< "$TF_OUTPUTS")
          distribution_id=$(jq -er '.cloudfront_distribution_id.value | strings | select(length > 0)' <<< "$TF_OUTPUTS")

          printf 'bucket=%s\ndistribution-id=%s\n' "$bucket" "$distribution_id" >> "$GITHUB_OUTPUT"
      - name: Upload immutable assets
        if: inputs.immutable-assets
        shell: bash
        env:
          SOURCE_DIR: ${{ runner.temp }}/static
          BUCKET: ${{ steps.site.outputs.bucket }}
        run: |
          set -euo pipefail

          aws s3 sync \
            "$SOURCE_DIR/assets" \
            "s3://$BUCKET/assets" \
            --no-follow-symlinks \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors
      - name: Upload mutable files
        shell: bash
        env:
          SOURCE_DIR: ${{ runner.temp }}/static
          BUCKET: ${{ steps.site.outputs.bucket }}
        run: |
          set -euo pipefail

          exclude_args=(--exclude "index.html")
          if [[ "$IMMUTABLE_ASSETS" == true ]]; then
            exclude_args+=(--exclude "assets/*")
          fi

          aws s3 sync \
            "$SOURCE_DIR" \
            "s3://$BUCKET" \
            --no-follow-symlinks \
            "${exclude_args[@]}" \
            --cache-control "public,max-age=0,s-maxage=31536000,must-revalidate" \
            --only-show-errors
      - name: Upload index.html
        shell: bash
        env:
          SOURCE_DIR: ${{ runner.temp }}/static
          BUCKET: ${{ steps.site.outputs.bucket }}
        run: |
          set -euo pipefail

          aws s3 cp \
            "$SOURCE_DIR/index.html" \
            "s3://$BUCKET/index.html" \
            --no-follow-symlinks \
            --cache-control "public,max-age=0,s-maxage=31536000,must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            --only-show-errors
      - name: Invalidate CloudFront
        uses: mr-chelyshkin/actions/aws-cloudfront-invalidate@v2
        with:
          distribution-id: ${{ steps.site.outputs.distribution-id }}
