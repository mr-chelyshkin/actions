name: PR workflow validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-workflow-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Check GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12

  check-job-results:
    if: always()
    needs: [actionlint]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check job results
        uses: ./check-job-results
        with:
          results: ${{ toJSON(needs) }}
