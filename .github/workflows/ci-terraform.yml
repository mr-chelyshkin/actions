name: Terraform CI

on:
  workflow_call:
    inputs:
      env-vars:
        description: Environment variables of every job as a JSON object.
        type: string
        default: '{}'
      aws-region:
        description: AWS region for aws-role-arn.
        type: string
        required: false
        default: ''
      aws-role-arn:
        description: AWS role to assume via OIDC for plan. Empty skips AWS login.
        type: string
        required: false
        default: ''
      gcp-workload-identity-provider:
        description: GCP Workload Identity provider for plan. Empty skips GCP login.
        type: string
        required: false
        default: ''
      gcp-service-account:
        description: GCP service account to impersonate.
        type: string
        required: false
        default: ''
      cache-path:
        description: Paths cached between runs; must match TERRAFORM_CACHE_DIR. Empty disables caching.
        type: string
        default: .cache/terraform
      cache-key-prefix:
        description: Cache key prefix. Change it to reset the cache.
        type: string
        default: terraform
      cache-dependency-path:
        description: Lock file path or glob hashed into the cache key.
        type: string
        default: '**/.terraform.lock.hcl'
    secrets:
      terraform-vars:
        description: Terraform variables as NAME=value lines, passed as TF_VAR_NAME.
        required: false
      credentials:
        description: Provider credentials as NAME=value lines, forwarded into the container.
        required: false

jobs:
  fmt:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.env-vars) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Terraform formatting
        uses: mr-chelyshkin/actions/invoke-taskfile@v2
        with: { task: ci/terraform/fmt }

  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.env-vars) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &terraform-cache
        name: Cache Terraform providers
        if: inputs.cache-path != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.cache-dependency-path) }}
          restore-keys: |
            ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate Terraform
        uses: mr-chelyshkin/actions/invoke-taskfile@v2
        with: { task: ci/terraform/validate }

  plan:
    needs: [fmt, validate]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env: ${{ fromJSON(inputs.env-vars) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *terraform-cache

      - name: Configure AWS credentials
        if: inputs.aws-role-arn != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.aws-role-arn }}
          role-session-name: terraform-plan-${{ github.run_id }}

      - name: Configure GCP credentials
        id: gcp
        if: inputs.gcp-workload-identity-provider != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}
          service_account: ${{ inputs.gcp-service-account }}
          token_format: access_token
          create_credentials_file: false

      - name: Export secrets
        shell: bash
        env:
          TERRAFORM_VARS: ${{ secrets.terraform-vars }}
          CREDENTIALS: ${{ secrets.credentials }}
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          OIDC_CREDENTIALS: >-
            ${{ inputs.aws-role-arn != '' && 'AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION' || '' }}
            ${{ inputs.gcp-workload-identity-provider != '' && 'GOOGLE_OAUTH_ACCESS_TOKEN GOOGLE_CLOUD_PROJECT' || '' }}
        run: |
          set -euo pipefail

          read -r -a names <<< "$OIDC_CREDENTIALS"
          if [[ -n "$GCP_ACCESS_TOKEN" ]]; then
            printf 'GOOGLE_OAUTH_ACCESS_TOKEN=%s\n' "$GCP_ACCESS_TOKEN" >> "$GITHUB_ENV"
          fi

          export_secrets() {
            local secret=$1 prefix=$2 line name value
            while IFS= read -r line; do
              line=${line%$'\r'}
              [[ -z "${line//[[:space:]]/}" ]] && continue
              name=${line%%=*}
              value=${line#*=}
              if [[ "$line" != *=* || ! "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                echo "::error::Each $secret line must be NAME=value."
                exit 1
              fi
              [[ -n "$value" ]] && echo "::add-mask::$value"
              printf '%s%s=%s\n' "$prefix" "$name" "$value" >> "$GITHUB_ENV"
              [[ -n "$prefix" ]] || names+=("$name")
            done
          }
          export_secrets terraform-vars TF_VAR_ <<< "$TERRAFORM_VARS"
          export_secrets credentials '' <<< "$CREDENTIALS"

          if (( ${#names[@]} )); then
            printf 'CONTAINER_ENVS=%s\n' "${CONTAINER_ENVS:+$CONTAINER_ENVS }${names[*]}" >> "$GITHUB_ENV"
          fi

      - name: Set up Task
        uses: mr-chelyshkin/actions/invoke-taskfile@v2
        with:
          task: ci/terraform/plan
          args: --dry

      - name: Plan Terraform
        shell: bash
        run: |
          set -euo pipefail

          task --yes --offline ci/terraform/plan | tee "$RUNNER_TEMP/terraform-plan.log"

          {
            printf '## Terraform plan\n\n~~~text\n'
            sed -E $'s/\033\\[[0-?]*[ -/]*[@-~]//g' "$RUNNER_TEMP/terraform-plan.log"
            printf '\n~~~\n'
          } >> "$GITHUB_STEP_SUMMARY"
