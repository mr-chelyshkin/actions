name: Pr changelog label

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: pr-label-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  label-check:
    name: Label check
    uses: ./.github/workflows/require-changelog-label.yml

  check-job-results:
    if: always()
    needs: [label-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check job results
        uses: ./check-job-results
        with:
          results: ${{ toJSON(needs) }}
