name: Go CI on Pr

on:
  workflow_call:
    inputs:
      fmt:
        description: Run the ci/fmt job.
        type: boolean
        default: true
      lint:
        description: Run the ci/lint job.
        type: boolean
        default: true
      test:
        description: Run the ci/test job.
        type: boolean
        default: true
      build:
        description: Run the ci/build job.
        type: boolean
        default: true
      vuln:
        description: Run the ci/vuln job.
        type: boolean
        default: true

jobs:
  fmt:
    name: Go format
    if: inputs.fmt
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check Go formatting
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with: { command: ci/fmt }

  lint:
    name: Go lint
    if: inputs.lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Lint Go
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with: { command: ci/lint }

  test:
    name: Go tests
    if: inputs.test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Run Go tests
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with: { command: ci/test }

  build:
    name: Go build
    if: inputs.build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Build Go binary
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with: { command: ci/build }

  vuln:
    name: Go vulnerabilities
    if: inputs.vuln
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check Go vulnerabilities
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with: { command: ci/vuln }
