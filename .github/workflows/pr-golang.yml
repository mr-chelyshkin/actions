name: Go CI on Pr

on:
  workflow_call:
    inputs:
      environment:
        description: Environment variables of every job as a JSON object.
        type: string
        default: '{}'
      cache-path:
        description: Host cache paths to preserve. Empty disables Go caching.
        type: string
        default: ''
      cache-key-prefix:
        description: Cache namespace. Change it to invalidate previous caches.
        type: string
        default: go
      cache-dependency-path:
        description: File path or glob to hash after checkout for dependency changes.
        type: string
        default: '**/go.sum'

jobs:
  fmt:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Go formatting
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/golang/fmt

  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &go-cache
        name: Cache Go modules and build results
        if: inputs.cache-path != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles(inputs.cache-dependency-path) }}
          restore-keys: |
            ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Lint Go
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/golang/lint

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *go-cache
      - name: Run Go tests
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/golang/test

  vuln:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *go-cache
      - name: Check Go vulnerabilities
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/golang/vuln
