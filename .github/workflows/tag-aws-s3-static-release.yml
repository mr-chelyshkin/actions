name: AWS S3 static release

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Artifact from this run containing the built static files and index.html at its root.
        type: string
        required: true
      immutable-assets:
        description: Publish fingerprinted assets/ with immutable cache headers.
        type: boolean
        default: true
      aws-region:
        description: AWS region containing the site bucket.
        type: string
        required: true
      terraform-state-bucket:
        description: S3 bucket containing Terraform state.
        type: string
        required: true
      terraform-state-key:
        description: Terraform state object key.
        type: string
        required: true
      terraform-state-region:
        description: AWS region containing the Terraform state bucket.
        type: string
        required: true
      terraform-role-arn:
        description: AWS role assumed through GitHub OIDC for apply and deploy.
        type: string
        required: true
      terraform-version:
        description: Terraform CLI version used to apply Terraform and read outputs.
        type: string
        required: false
        default: 1.15.9
      terraform-workdir:
        description: Terraform working directory relative to the workspace.
        type: string
        required: false
        default: .
      domain-name:
        description: CloudFront alias managed outside this stack.
        type: string
        required: true
      site-bucket-name:
        description: Globally unique S3 bucket name for the built site.
        type: string
        required: true
      acm-certificate-arn:
        description: ACM certificate ARN in us-east-1 for CloudFront.
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      IMMUTABLE_ASSETS: ${{ inputs.immutable-assets }}
    steps:
      - uses: actions/checkout@v6
      - name: Download static artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/static
      - name: Validate static artifact
        shell: bash
        env:
          SOURCE_DIR: ${{ runner.temp }}/static
        run: |
          set -euo pipefail

          if [[ ! -f "$SOURCE_DIR/index.html" || -L "$SOURCE_DIR/index.html" ]]; then
            echo "::error::Static artifact must contain a regular index.html at its root."
            exit 1
          fi

          if [[ "$IMMUTABLE_ASSETS" == true && ! -d "$SOURCE_DIR/assets" ]]; then
            echo "::error::immutable-assets requires an assets/ directory containing fingerprinted files."
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.terraform-role-arn }}
          role-session-name: static-release-${{ github.run_id }}
      - name: Apply Terraform
        id: apply
        uses: mr-chelyshkin/actions/terraform-apply@v1
        env:
          TF_VAR_aws_region: ${{ inputs.aws-region }}
          TF_VAR_domain_name: ${{ inputs.domain-name }}
          TF_VAR_site_bucket_name: ${{ inputs.site-bucket-name }}
          TF_VAR_acm_certificate_arn: ${{ inputs.acm-certificate-arn }}
        with:
          backend-region: ${{ inputs.terraform-state-region }}
          backend-bucket: ${{ inputs.terraform-state-bucket }}
          backend-key: ${{ inputs.terraform-state-key }}
          workdir: ${{ inputs.terraform-workdir }}
          version: ${{ inputs.terraform-version }}
      - name: Publish immutable assets to S3
        if: inputs.immutable-assets
        shell: bash
        env:
          SOURCE_DIR: ${{ runner.temp }}/static
          BUCKET: ${{ fromJSON(steps.apply.outputs.outputs).site_bucket_name.value }}
        run: |
          set -euo pipefail

          aws s3 sync \
            "$SOURCE_DIR/assets" \
            "s3://$BUCKET/assets" \
            --no-follow-symlinks \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors
      - name: Publish mutable files to S3
        shell: bash
        env:
          SOURCE_DIR: ${{ runner.temp }}/static
          BUCKET: ${{ fromJSON(steps.apply.outputs.outputs).site_bucket_name.value }}
        run: |
          set -euo pipefail

          exclude_args=(--exclude "index.html")
          if [[ "$IMMUTABLE_ASSETS" == true ]]; then
            exclude_args+=(--exclude "assets/*")
          fi

          aws s3 sync \
            "$SOURCE_DIR" \
            "s3://$BUCKET" \
            --no-follow-symlinks \
            "${exclude_args[@]}" \
            --cache-control "public,max-age=0,s-maxage=31536000,must-revalidate" \
            --only-show-errors
      - name: Publish index to S3
        shell: bash
        env:
          SOURCE_DIR: ${{ runner.temp }}/static
          BUCKET: ${{ fromJSON(steps.apply.outputs.outputs).site_bucket_name.value }}
        run: |
          set -euo pipefail

          aws s3 cp \
            "$SOURCE_DIR/index.html" \
            "s3://$BUCKET/index.html" \
            --no-follow-symlinks \
            --cache-control "public,max-age=0,s-maxage=31536000,must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            --only-show-errors
      - name: Invalidate CloudFront
        uses: mr-chelyshkin/actions/aws-cloudfront-invalidate@v1
        with:
          distribution-id: ${{ fromJSON(steps.apply.outputs.outputs).cloudfront_distribution_id.value }}
