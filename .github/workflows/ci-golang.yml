name: Go CI

on:
  workflow_call:
    inputs:
      env-vars:
        description: Environment variables of every job as a JSON object.
        type: string
        default: '{}'
      cache-path:
        description: Paths cached between runs; must match GO_CACHE_DIR. Empty disables caching.
        type: string
        default: .cache/go
      cache-key-prefix:
        description: Cache key prefix. Change it to reset the cache.
        type: string
        default: go
      cache-dependency-path:
        description: Lock file path or glob hashed into the cache key.
        type: string
        default: '**/go.sum'

jobs:
  fmt:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.env-vars) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Go formatting
        uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: ci/golang/fmt

  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.env-vars) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &go-cache
        name: Cache Go build
        if: inputs.cache-path != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles(inputs.cache-dependency-path) }}-${{ github.sha }}
          restore-keys: |
            ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles(inputs.cache-dependency-path) }}-
            ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Lint Go
        uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: ci/golang/lint

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.env-vars) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *go-cache
      - name: Run Go tests
        uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: ci/golang/test

  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.env-vars) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *go-cache
      - name: Audit Go dependencies
        uses: mr-chelyshkin/actions/task-run@v2
        with:
          task: ci/golang/audit
