name: Rust CI on Pr

on:
  workflow_call:
    inputs:
      environment:
        description: Environment variables of every job as a JSON object.
        type: string
        default: '{}'
      cache-path:
        description: Host cache paths to preserve. Empty disables Rust caching.
        type: string
        default: ''
      cache-key-prefix:
        description: Cache namespace. Change it to invalidate previous caches.
        type: string
        default: rust
      cache-dependency-path:
        description: File path or glob to hash after checkout for dependency changes.
        type: string
        default: '**/Cargo.lock'

jobs:
  fmt:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Rust formatting
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/rust/fmt

  clippy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &rust-cache
        name: Cache Cargo registry and build results
        if: inputs.cache-path != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles(inputs.cache-dependency-path) }}
          restore-keys: |
            ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Lint Rust
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/rust/clippy

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *rust-cache
      - name: Run Rust tests
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/rust/test

  docs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *rust-cache
      - name: Check Rust documentation
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/rust/docs/check

  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit Rust dependencies
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/rust/audit
