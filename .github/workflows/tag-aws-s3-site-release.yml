name: AWS S3 site release

on:
  workflow_call:
    inputs:
      aws-region:
        description: AWS region containing the site bucket.
        type: string
        required: true
      terraform-state-bucket:
        description: S3 bucket containing Terraform state.
        type: string
        required: true
      terraform-state-key:
        description: Terraform state object key.
        type: string
        required: true
      terraform-state-region:
        description: AWS region containing the Terraform state bucket.
        type: string
        required: true
      terraform-role-arn:
        description: AWS role assumed through GitHub OIDC for apply and deploy.
        type: string
        required: true
      terraform-version:
        description: Terraform CLI version used to apply Terraform and read outputs.
        type: string
        required: false
        default: 1.15.9
      terraform-workdir:
        description: Terraform working directory relative to the workspace.
        type: string
        required: false
        default: .
      domain-name:
        description: CloudFront alias managed outside this stack.
        type: string
        required: true
      site-bucket-name:
        description: Globally unique S3 bucket name for the built site.
        type: string
        required: true
      acm-certificate-arn:
        description: ACM certificate ARN in us-east-1 for CloudFront.
        type: string
        required: true
      default-branch:
        description: Branch that must contain the tagged commit.
        type: string
        required: false
        default: main

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Verify tag commit belongs to the default branch
        uses: mr-chelyshkin/actions/check-tag-branch@v1
        with:
          branch: ${{ inputs.default-branch }}

  build:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Build static site
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with: { command: ci/build }
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: static-site-${{ github.sha }}
          path: app/dist/
          if-no-files-found: error
          retention-days: 7

  apply:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    outputs:
      site-bucket-name: ${{ fromJSON(steps.apply.outputs.outputs).site_bucket_name.value }}
      cloudfront-distribution-id: ${{ fromJSON(steps.apply.outputs.outputs).cloudfront_distribution_id.value }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_aws_region: ${{ inputs.aws-region }}
      TF_VAR_domain_name: ${{ inputs.domain-name }}
      TF_VAR_site_bucket_name: ${{ inputs.site-bucket-name }}
      TF_VAR_acm_certificate_arn: ${{ inputs.acm-certificate-arn }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.terraform-role-arn }}
          role-session-name: solti-site-apply-${{ github.run_id }}
      - name: Apply Terraform
        id: apply
        uses: mr-chelyshkin/actions/terraform-apply@v1
        with:
          backend-region: ${{ inputs.terraform-state-region }}
          backend-bucket: ${{ inputs.terraform-state-bucket }}
          backend-key: ${{ inputs.terraform-state-key }}
          workdir: ${{ inputs.terraform-workdir }}
          version: ${{ inputs.terraform-version }}

  deploy:
    needs: [build, apply]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: static-site-${{ github.sha }}
          path: app/dist
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.terraform-role-arn }}
          role-session-name: solti-site-deploy-${{ github.run_id }}
      - name: Publish immutable assets to S3
        shell: bash
        env:
          SOURCE_DIR: ${{ github.workspace }}/app/dist
          BUCKET: ${{ needs.apply.outputs['site-bucket-name'] }}
        run: |
          set -euo pipefail

          test -d "$SOURCE_DIR"
          test -d "$SOURCE_DIR/assets"

          if [[ -L "$SOURCE_DIR/index.html" ]]; then
            echo "::error::index.html must not be a symbolic link."
            exit 1
          fi

          test -f "$SOURCE_DIR/index.html"

          aws s3 sync \
            "$SOURCE_DIR/assets" \
            "s3://$BUCKET/assets" \
            --no-follow-symlinks \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors
      - name: Publish mutable files to S3
        shell: bash
        env:
          SOURCE_DIR: ${{ github.workspace }}/app/dist
          BUCKET: ${{ needs.apply.outputs['site-bucket-name'] }}
        run: |
          set -euo pipefail

          aws s3 sync \
            "$SOURCE_DIR" \
            "s3://$BUCKET" \
            --no-follow-symlinks \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public,max-age=0,s-maxage=31536000,must-revalidate" \
            --only-show-errors
      - name: Publish index to S3
        shell: bash
        env:
          SOURCE_DIR: ${{ github.workspace }}/app/dist
          BUCKET: ${{ needs.apply.outputs['site-bucket-name'] }}
        run: |
          set -euo pipefail

          aws s3 cp \
            "$SOURCE_DIR/index.html" \
            "s3://$BUCKET/index.html" \
            --no-follow-symlinks \
            --cache-control "public,max-age=0,s-maxage=31536000,must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            --only-show-errors
      - name: Invalidate CloudFront
        uses: mr-chelyshkin/actions/aws-cloudfront-invalidate@v1
        with:
          distribution-id: ${{ needs.apply.outputs['cloudfront-distribution-id'] }}

  gh-release:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
