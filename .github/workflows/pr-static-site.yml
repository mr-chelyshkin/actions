name: Static CI on Pr

on:
  workflow_call:
    inputs:
      environment:
        description: Task environment as comma-separated KEY=value pairs, passed to invoke-taskfile.
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Build static site
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/static-build
          environment: ${{ inputs.environment }}

  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Audit dependencies
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/static-audit
          environment: ${{ inputs.environment }}

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Run tests
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/static-test
          environment: ${{ inputs.environment }}
