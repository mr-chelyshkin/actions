name: Static CI on Pr

on:
  workflow_call:
    inputs:
      environment:
        description: Environment variables of every job as a JSON object.
        type: string
        default: '{}'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build static site
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/static/build

  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Audit dependencies
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/static/audit

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run tests
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/static/test
