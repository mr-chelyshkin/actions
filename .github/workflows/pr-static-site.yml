name: Static CI on Pr

on:
  workflow_call:
    inputs:
      environment:
        description: Environment variables of every job as a JSON object.
        type: string
        default: '{}'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build static site
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/static/build

  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit dependencies
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/static/audit

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env: ${{ fromJSON(inputs.environment) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run tests
        uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with:
          command: ci/static/test
