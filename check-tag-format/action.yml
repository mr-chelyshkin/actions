name: Check tag format
description: Check a tag name against a configurable regular expression.

inputs:
  pattern:
    description: Bash extended regular expression matched against github.ref_name.
    required: false
    default: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

runs:
  using: composite
  steps:
    - name: Verify tag format
      shell: bash
      env:
        TAG_NAME: ${{ github.ref_name }}
        TAG_PATTERN: ${{ inputs.pattern }}
        LC_ALL: C
      run: |
        set -euo pipefail

        if [[ -z "$TAG_PATTERN" ]]; then
          echo '::error::Input "pattern" must not be empty.'
          exit 1
        fi

        if [[ "$TAG_NAME" =~ $TAG_PATTERN ]]; then
          printf 'Tag %q matches the required pattern.\n' "$TAG_NAME"
        else
          status=$?
          if [[ "$status" -eq 2 ]]; then
            echo '::error::Input "pattern" is not a valid Bash extended regular expression.'
          else
            printf '::error::Tag %q does not match the required pattern.\n' "$TAG_NAME"
          fi
          exit 1
        fi
