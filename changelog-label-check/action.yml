name: Changelog label check
description: Require an allowed label on the pull request.

inputs:
  allowed-labels:
    description: Allowed labels, one per line. Empty allows any label.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check PR labels
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        ALLOWED_LABELS: ${{ inputs.allowed-labels }}
      run: |
        set -euo pipefail

        applied=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | sort -u)

        if [ -z "$applied" ]; then
          echo "::error::PR has no labels."
          exit 1
        fi

        allowed=$(printf '%s\n' "$ALLOWED_LABELS" | sed '/^$/d' | sort -u)
        if [ -z "$allowed" ]; then
          match="$applied"
        else
          match=$(comm -12 <(printf '%s\n' "$allowed") <(printf '%s\n' "$applied") || true)
        fi

        if [ -z "$match" ]; then
          echo "::error::PR has no allowed label. Apply at least one of:"
          while IFS= read -r label; do
            printf '  - %s\n' "$label"
          done <<< "$allowed"
          echo "Currently on PR: $applied"
          exit 1
        fi
        printf 'matched:'
        while IFS= read -r label; do
          printf ' %s' "$label"
        done <<< "$match"
        printf '\n'
