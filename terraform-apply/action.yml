name: Terraform apply
description: Apply Terraform with an S3 backend and return its outputs.

inputs:
  terraform-version:
    description: Terraform version. Empty reads .terraform-version in working-directory.
    required: false
    default: ''
  working-directory:
    description: Terraform directory relative to the workspace.
    required: false
    default: .
  terraform-state-bucket:
    description: S3 bucket for Terraform state.
    required: true
  terraform-state-key:
    description: S3 object key for Terraform state.
    required: true
  terraform-state-region:
    description: AWS region of the state bucket.
    required: true
  write-summary:
    description: Write init and apply output to the step summary.
    required: false
    default: "true"

outputs:
  terraform-outputs:
    description: Terraform outputs as JSON.
    value: ${{ steps.apply.outputs.terraform-outputs }}

runs:
  using: composite
  steps:
    - name: Resolve Terraform version
      id: version
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
      env:
        TERRAFORM_VERSION: ${{ inputs.terraform-version }}
      run: |
        set -euo pipefail

        version=$TERRAFORM_VERSION
        if [[ -z "$version" && -f .terraform-version ]]; then
          version=$(sed -nE '1s/^[[:space:]]*v?([^[:space:]]+).*/\1/p' .terraform-version)
        fi
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo '::error::Input "terraform-version" must be X.Y.Z, or empty with X.Y.Z pinned in .terraform-version.'
          exit 1
        fi
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.version.outputs.version }}
        terraform_wrapper: false

    - name: Apply Terraform
      id: apply
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
      env:
        TF_BACKEND_REGION: ${{ inputs.terraform-state-region }}
        TF_BACKEND_BUCKET: ${{ inputs.terraform-state-bucket }}
        TF_BACKEND_KEY: ${{ inputs.terraform-state-key }}
        WRITE_SUMMARY: ${{ inputs.write-summary }}
        CHECKPOINT_DISABLE: "1"
        TF_IN_AUTOMATION: "1"
      run: |
        set -euo pipefail

        case "$WRITE_SUMMARY" in
          true|false) ;;
          *)
            echo '::error::Input "write-summary" must be true or false.'
            exit 1
            ;;
        esac

        summary_open=false
        close_summary() {
          if [[ "$summary_open" == true ]]; then
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
        }
        trap close_summary EXIT

        if [[ "$WRITE_SUMMARY" == true ]]; then
          printf '## Terraform apply\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          summary_open=true
        fi

        run_terraform() {
          if [[ "$WRITE_SUMMARY" == true ]]; then
            terraform "$@" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            terraform "$@"
          fi
        }

        run_terraform init \
          -input=false \
          -no-color \
          -reconfigure \
          -lockfile=readonly \
          "-backend-config=bucket=$TF_BACKEND_BUCKET" \
          "-backend-config=region=$TF_BACKEND_REGION" \
          "-backend-config=key=$TF_BACKEND_KEY" \
          -backend-config=encrypt=true \
          -backend-config=use_lockfile=true

        run_terraform apply \
          -auto-approve \
          -input=false \
          -lock-timeout=5m \
          -no-color

        outputs=$(terraform output -json | jq 'with_entries(select(.value.sensitive | not))')
        delimiter="terraform_outputs_${RANDOM}_${RANDOM}_${RANDOM}"
        while [[ $'\n'$outputs$'\n' == *$'\n'$delimiter$'\n'* ]]; do
          delimiter="${delimiter}_"
        done
        {
          printf 'terraform-outputs<<%s\n' "$delimiter"
          printf '%s\n' "$outputs"
          printf '%s\n' "$delimiter"
        } >> "$GITHUB_OUTPUT"
