name: Check tag branch
description: Check that a tag commit is contained in a remote branch.

inputs:
  tag:
    description: Tag to check.
    required: false
    default: ${{ github.ref_name }}
  branch:
    description: Branch to check.
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Verify tag commit
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ inputs.branch }}
        TAG_NAME: ${{ inputs.tag }}
      run: |
        set -euo pipefail

        git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"

        tag_sha=$(git rev-parse --verify "refs/tags/${TAG_NAME}^{commit}")
        branch_sha=$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")

        if ! git merge-base --is-ancestor "$tag_sha" "$branch_sha"; then
          echo "::error::Tag ${TAG_NAME} points to ${tag_sha}, which is not contained in ${DEFAULT_BRANCH} (${branch_sha})."
          exit 1
        fi

        echo "Tag ${TAG_NAME} points to ${tag_sha}, contained in ${DEFAULT_BRANCH} (${branch_sha})."
