name: Invoke Taskfile
description: Run a command from the consumer's Taskfile.

inputs:
  command:
    description: Task command and arguments to run.
    required: true
  environment:
    description: Environment variables as comma-separated KEY=value pairs.
    required: false
  directory:
    description: Working directory where Task runs.
    required: false
    default: '.'
  version:
    description: Task release version without the v prefix.
    required: false
    default: '3.53.1'

runs:
  using: composite
  steps:
    - name: Cache Task binary
      id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/task-bin/${{ inputs.version }}
        key: task-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install Task
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TASK_VERSION: ${{ inputs.version }}
        TASK_INSTALL_DIR: ${{ runner.temp }}/task-bin/${{ inputs.version }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS" in
          Linux) task_os=linux ;;
          macOS) task_os=darwin ;;
          *)
            echo "::error::Unsupported runner OS: $RUNNER_OS"
            exit 1
            ;;
        esac

        case "$RUNNER_ARCH" in
          X64) task_arch=amd64 ;;
          ARM64) task_arch=arm64 ;;
          *)
            echo "::error::Unsupported runner architecture: $RUNNER_ARCH"
            exit 1
            ;;
        esac

        # Checksums of the default version, from its task_checksums.txt. Update them with the default
        # of the version input. Another version is checked against the checksums of its release.
        case "${TASK_VERSION}/${task_os}_${task_arch}" in
          3.53.1/linux_amd64)  task_sha256=a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7 ;;
          3.53.1/linux_arm64)  task_sha256=e3ad19101493a0112e1f22ae8ccc54bf03e533b1076a0ca1e6c782a09ad2e588 ;;
          3.53.1/darwin_amd64) task_sha256=7f1a702d54a789cb818a636039a83df071f4179893133afafa4eba351a7e19ef ;;
          3.53.1/darwin_arm64) task_sha256=85d2d96c2380b33d7855b07b3f7a20dc7ca0eda999a26efa0fb5f6f32b366cd7 ;;
          *) task_sha256='' ;;
        esac

        task_release_url="https://github.com/go-task/task/releases/download/v${TASK_VERSION}"
        task_archive="task_${task_os}_${task_arch}.tar.gz"
        task_download_dir=$(mktemp -d "$RUNNER_TEMP/task-download.XXXXXX")
        trap 'rm -rf "$task_download_dir"' EXIT
        curl -fsSL -o "$task_download_dir/$task_archive" "$task_release_url/$task_archive"

        if [[ -z "$task_sha256" ]]; then
          echo "::notice::Task ${TASK_VERSION} has no pinned checksum; checking it against task_checksums.txt of its release."
          curl -fsSL -o "$task_download_dir/task_checksums.txt" "$task_release_url/task_checksums.txt"
          task_sha256=$(awk -v archive="$task_archive" '$2 == archive { print $1 }' "$task_download_dir/task_checksums.txt")
          if [[ -z "$task_sha256" ]]; then
            echo "::error::task_checksums.txt of Task ${TASK_VERSION} has no checksum for ${task_archive}."
            exit 1
          fi
        fi

        if command -v sha256sum > /dev/null; then
          actual_sha256=$(sha256sum "$task_download_dir/$task_archive" | cut -d ' ' -f 1)
        else
          actual_sha256=$(shasum -a 256 "$task_download_dir/$task_archive" | cut -d ' ' -f 1)
        fi
        if [[ "$actual_sha256" != "$task_sha256" ]]; then
          echo "::error::${task_archive} of Task ${TASK_VERSION} has SHA-256 ${actual_sha256}, expected ${task_sha256}."
          exit 1
        fi

        mkdir -p "$TASK_INSTALL_DIR"
        tar -xzf "$task_download_dir/$task_archive" -C "$TASK_INSTALL_DIR" task
        chmod 755 "$TASK_INSTALL_DIR/task"

    - name: Add Task to PATH
      shell: bash
      env:
        TASK_INSTALL_DIR: ${{ runner.temp }}/task-bin/${{ inputs.version }}
      run: printf '%s\n' "$TASK_INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Print Task version
      shell: bash
      run: task --version

    - name: Export Task environment
      if: ${{ inputs.environment != '' }}
      shell: bash
      env:
        TASK_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail

        IFS=',' read -ra TASK_ENVIRONMENT_ENTRIES <<< "$TASK_ENVIRONMENT"
        for task_environment_entry in "${TASK_ENVIRONMENT_ENTRIES[@]}"; do
          [[ "$task_environment_entry" =~ ^([^=]+)=(.+)$ ]] && echo "${BASH_REMATCH[1]}=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
        done

    - name: Run Task command
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        TASK_X_REMOTE_TASKFILES: "1"
      run: |
        set -euo pipefail
        task --yes ${{ inputs.command }}
