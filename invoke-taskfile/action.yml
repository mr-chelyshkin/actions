name: Invoke Taskfile
description: Run a command from the consumer's Taskfile.

inputs:
  command:
    description: Task command and arguments to run.
    required: true
  environment:
    description: Environment variables as comma-separated KEY=value pairs.
    required: false
  directory:
    description: Working directory where Task runs.
    required: false
    default: '.'
  version:
    description: Task release version without the v prefix.
    required: false
    default: '3.53.1'

runs:
  using: composite
  steps:
    - name: Cache Task binary
      id: cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/task-bin/${{ inputs.version }}
        key: task-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install Task
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TASK_VERSION: ${{ inputs.version }}
        TASK_INSTALL_DIR: ${{ runner.temp }}/task-bin/${{ inputs.version }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS" in
          Linux) task_os=linux ;;
          macOS) task_os=darwin ;;
          *)
            echo "::error::Unsupported runner OS: $RUNNER_OS"
            exit 1
            ;;
        esac

        case "$RUNNER_ARCH" in
          X64) task_arch=amd64 ;;
          ARM64) task_arch=arm64 ;;
          *)
            echo "::error::Unsupported runner architecture: $RUNNER_ARCH"
            exit 1
            ;;
        esac

        task_download_url="https://github.com/go-task/task/releases/download/v${TASK_VERSION}/task_${task_os}_${task_arch}.tar.gz"
        mkdir -p "$TASK_INSTALL_DIR"
        curl -fsSL "$task_download_url" | tar -xz -C "$TASK_INSTALL_DIR" task
        chmod 755 "$TASK_INSTALL_DIR/task"

    - name: Add Task to PATH
      shell: bash
      env:
        TASK_INSTALL_DIR: ${{ runner.temp }}/task-bin/${{ inputs.version }}
      run: printf '%s\n' "$TASK_INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Print Task version
      shell: bash
      run: task --version

    - name: Export Task environment
      if: ${{ inputs.environment != '' }}
      shell: bash
      env:
        TASK_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail

        IFS=',' read -ra TASK_ENVIRONMENT_ENTRIES <<< "$TASK_ENVIRONMENT"
        for task_environment_entry in "${TASK_ENVIRONMENT_ENTRIES[@]}"; do
          [[ "$task_environment_entry" =~ ^([^=]+)=(.+)$ ]] && echo "${BASH_REMATCH[1]}=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
        done

    - name: Run Task command
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        TASK_X_REMOTE_TASKFILES: "1"
      run: |
        set -euo pipefail
        task --yes ${{ inputs.command }}
